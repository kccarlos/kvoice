<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="kvoice">
  <!--
    Source of truth for the app icon. Regenerate AppIcon.icns after editing:

        ./Scripts/make_app_icon.sh

    The design: an ink squircle, orange sound waves, a white microphone and
    a blue text cursor. Voice in, text out.

    This file draws every size from 64 px up. The 16 and 32 px entries of
    the iconset come from AppIcon-16.svg and AppIcon-32.svg beside it:
    hand-tuned artwork with fewer, thicker shapes on a whole-pixel grid,
    because this artwork scaled down that far smudges the waves and loses
    the cursor. Change the design here and in those two files together.

    Geometry follows Apple's macOS icon grid: on a 1024 canvas the icon body is
    824x824 inset by 100 on every side, a continuous-corner squircle with a
    radius of 824 * 0.225. The surrounding margin is intentional; macOS expects
    it, the drop shadow falls into it, and the Dock adds neither.

    The colours: tile #26304F to #0C1022, waves #FFB02E to #FF6A2B, cursor
    #3D8BFF. The README banner, the social preview and the App Store
    screenshots use the same palette (StoreScreenshotTests.swift).

    The tile's middle stop (#29335F at 42 percent) stands in for the soft
    radial glow of the original concept. A radial glow is rendered with
    dithering noise that PNG cannot compress: it took AppIcon.icns from
    about 0.45 MB to 1.05 MB, over the public export's 1 MB limit per file.
    A vertical gradient has no such cost. Keep the tile fill vertical.

    Note for editors: an XML comment may not contain a double hyphen. Using one
    makes NSImage reject the whole file, and it fails silently.
  -->
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.30"/>
    </filter>
    <clipPath id="body"><path d="M 383.41 100.00 L 640.59 100.00 C 722.19 100.00 763.00 100.00 799.79 112.14 L 806.92 113.89 C 854.88 131.34 892.66 169.12 910.11 217.08 L 911.86 224.21 C 924.00 261.00 924.00 301.81 924.00 383.41 L 924.00 640.59 C 924.00 722.19 924.00 763.00 911.86 799.79 L 910.11 806.92 C 892.66 854.88 854.88 892.66 806.92 910.11 L 799.79 911.86 C 763.00 924.00 722.19 924.00 640.59 924.00 L 383.41 924.00 C 301.81 924.00 261.00 924.00 224.21 911.86 L 217.08 910.11 C 169.12 892.66 131.34 854.88 113.89 806.92 L 112.14 799.79 C 100.00 763.00 100.00 722.19 100.00 640.59 L 100.00 383.41 C 100.00 301.81 100.00 261.00 112.14 224.21 L 113.89 217.08 C 131.34 169.12 169.12 131.34 217.08 113.89 L 224.21 112.14 C 261.00 100.00 301.81 100.00 383.41 100.00 Z"/></clipPath>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#26304F"/>
      <stop offset="0.42" stop-color="#29335F"/>
      <stop offset="1" stop-color="#0C1022"/>
    </linearGradient>
    <linearGradient id="wave" gradientUnits="userSpaceOnUse" x1="0" y1="371" x2="0" y2="591">
      <stop offset="0" stop-color="#FFB02E"/>
      <stop offset="1" stop-color="#FF6A2B"/>
    </linearGradient>
  </defs>
  <path d="M 383.41 100.00 L 640.59 100.00 C 722.19 100.00 763.00 100.00 799.79 112.14 L 806.92 113.89 C 854.88 131.34 892.66 169.12 910.11 217.08 L 911.86 224.21 C 924.00 261.00 924.00 301.81 924.00 383.41 L 924.00 640.59 C 924.00 722.19 924.00 763.00 911.86 799.79 L 910.11 806.92 C 892.66 854.88 854.88 892.66 806.92 910.11 L 799.79 911.86 C 763.00 924.00 722.19 924.00 640.59 924.00 L 383.41 924.00 C 301.81 924.00 261.00 924.00 224.21 911.86 L 217.08 910.11 C 169.12 892.66 131.34 854.88 113.89 806.92 L 112.14 799.79 C 100.00 763.00 100.00 722.19 100.00 640.59 L 100.00 383.41 C 100.00 301.81 100.00 261.00 112.14 224.21 L 113.89 217.08 C 131.34 169.12 169.12 131.34 217.08 113.89 L 224.21 112.14 C 261.00 100.00 301.81 100.00 383.41 100.00 Z" fill="url(#tile)" filter="url(#shadow)"/>
  <path d="M 383.41 100.00 L 640.59 100.00 C 722.19 100.00 763.00 100.00 799.79 112.14 L 806.92 113.89 C 854.88 131.34 892.66 169.12 910.11 217.08 L 911.86 224.21 C 924.00 261.00 924.00 301.81 924.00 383.41 L 924.00 640.59 C 924.00 722.19 924.00 763.00 911.86 799.79 L 910.11 806.92 C 892.66 854.88 854.88 892.66 806.92 910.11 L 799.79 911.86 C 763.00 924.00 722.19 924.00 640.59 924.00 L 383.41 924.00 C 301.81 924.00 261.00 924.00 224.21 911.86 L 217.08 910.11 C 169.12 892.66 131.34 854.88 113.89 806.92 L 112.14 799.79 C 100.00 763.00 100.00 722.19 100.00 640.59 L 100.00 383.41 C 100.00 301.81 100.00 261.00 112.14 224.21 L 113.89 217.08 C 131.34 169.12 169.12 131.34 217.08 113.89 L 224.21 112.14 C 261.00 100.00 301.81 100.00 383.41 100.00 Z" fill="none" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="4" clip-path="url(#body)"/>
  <g transform="translate(512 512) scale(1.12) translate(-593 -474.5)">
    <g fill="url(#wave)" opacity="1.0">
