<svg xmlns="http://www.w3.org/2000/svg" viewBox="-2 -1 22 20" width="22" height="20" role="img" aria-label="">
  <!--
    The halo only, with no crisp glyph. Drawn over MenuBarLogo.svg and tinted
    at runtime (it is a template image, so the controller recolours it per
    state: red while recording, the accent colour while processing), with its
    opacity animated to pulse.

    Two blurred copies rather than one: a wide soft bloom plus a tighter, denser
    core, which reads as a glow at menu-bar size where a single Gaussian just
    looks like a smudge. The shapes are duplicated rather than shared through a
    "use" element, so this file depends on nothing beyond feGaussianBlur, which
    is verified to survive NSImage's SVG rendering.

    The viewBox matches MenuBarLogo.svg exactly; see the note there.

    Note for editors: an XML comment may not contain a double hyphen. Using one
    here makes NSImage reject the whole file, and it fails silently.
  -->
  <defs>
    <filter id="wide" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="0.8"/>
    </filter>
    <filter id="core" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="0.3"/>
    </filter>
  </defs>

  <g fill="#000" filter="url(#wide)" opacity="0.6">
    <!-- Microphone: body, cup, stem and base -->
    <path d="M3.6 3.9 A2.4 2.4 0 0 1 8.4 3.9 V7.6 A2.4 2.4 0 0 1 3.6 7.6 Z"/>
    <path d="M1.75 6.25 V7.75 A4.25 4.25 0 0 0 10.25 7.75 V6.25" fill="none" stroke="#000" stroke-width="1.5" stroke-linecap="round"/>
    <rect x="5.25" y="11.5" width="1.5" height="3"/>
    <rect x="2.75" y="14" width="6.5" height="1.6" rx="0.8"/>
    <!-- Text cursor (I-beam) -->
    <rect x="13.75" y="4" width="1.5" height="9.5"/>
    <path d="M12.75 4 H16.25 M12.75 13.5 H16.25" fill="none" stroke="#000" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <g fill="#000" filter="url(#core)" opacity="0.9">
    <!-- Microphone: body, cup, stem and base -->
    <path d="M3.6 3.9 A2.4 2.4 0 0 1 8.4 3.9 V7.6 A2.4 2.4 0 0 1 3.6 7.6 Z"/>
    <path d="M1.75 6.25 V7.75 A4.25 4.25 0 0 0 10.25 7.75 V6.25" fill="none" stroke="#000" stroke-width="1.5" stroke-linecap="round"/>
    <rect x="5.25" y="11.5" width="1.5" height="3"/>
    <rect x="2.75" y="14" width="6.5" height="1.6" rx="0.8"/>
    <!-- Text cursor (I-beam) -->
    <rect x="13.75" y="4" width="1.5" height="9.5"/>
    <path d="M12.75 4 H16.25 M12.75 13.5 H16.25" fill="none" stroke="#000" stroke-width="1.5" stroke-linecap="round"/>
  </g>
</svg>
