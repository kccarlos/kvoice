<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -2 20 20" width="20" height="20" role="img" aria-label="KVoice">
  <!--
    The menu-bar glyph as Panel.dc.html draws it (UI v2 fidelity F1): three
    level bars and a microphone, a 20 x 16 point drawing stroked at 1.6
    with round caps. Rendered as an AppKit template image, so only alpha
    matters: black on a light menu bar, white on a dark one, inverted
    correctly while the menu is open.

    StatusItemArtwork draws one viewBox unit as one point. The viewBox adds
    two units above and below the 16 unit drawing so the image is 20 points
    tall, the height the status button is sized for; the glyph itself keeps
    the design's 20 x 16 points. The recording and processing halo is drawn
    in code (StatusItemIconController), not from an image.

    Note for editors: an XML comment may not contain a double hyphen. Using one
    makes NSImage reject the whole file, and it fails silently.
  -->
  <g fill="none" stroke="#000" stroke-width="1.6" stroke-linecap="round">
    <path d="M2 7v2M5 5v6M8 3v10"/>
    <rect x="11" y="2" width="5" height="8" rx="2.5"/>
    <path d="M10 8.5a3.5 3.5 0 0 0 7 0M13.5 12v2"/>
  </g>
</svg>
