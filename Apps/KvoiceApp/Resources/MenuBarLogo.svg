<svg xmlns="http://www.w3.org/2000/svg" viewBox="-2 -1 22 20" width="22" height="20" role="img" aria-label="kvoice">
  <!--
    The menu-bar glyph: a microphone and a text cursor, the app icon's
    artwork without the sound waves (three bars under a point apart merge
    into grey at this size). Rendered as an AppKit template image, so only
    alpha matters: the black fill becomes black on a light menu bar and white
    on a dark one, and inverts correctly while the menu is open.

    The artwork is drawn on an 18 x 18 point grid (x 1 to 17, y 1.5 to 15.6,
    strokes on half points so they land on whole pixels at 1x and 2x).
    StatusItemIconController draws one viewBox unit as one point, so the
    glyph is about 14 points tall, the weight of Apple's own menu-bar glyphs.

    The viewBox is deliberately NOT the artwork's bounds: it adds two units
    left and right and one above and below, a margin MenuBarLogoGlow.svg
    bleeds its halo into. Both files MUST keep the same viewBox, or the glyph
    would visibly change size whenever the glow turns on. Keep the offsets
    whole numbers, or the pixel grid shifts.

    Note for editors: an XML comment may not contain a double hyphen. Using one
    makes NSImage reject the whole file, and it fails silently.
  -->
  <g fill="#000">
    <!-- Microphone: body, cup, stem and base -->
    <path d="M3.6 3.9 A2.4 2.4 0 0 1 8.4 3.9 V7.6 A2.4 2.4 0 0 1 3.6 7.6 Z"/>
    <path d="M1.75 6.25 V7.75 A4.25 4.25 0 0 0 10.25 7.75 V6.25" fill="none" stroke="#000" stroke-width="1.5" stroke-linecap="round"/>
    <rect x="5.25" y="11.5" width="1.5" height="3"/>
    <rect x="2.75" y="14" width="6.5" height="1.6" rx="0.8"/>
    <!-- Text cursor (I-beam) -->
    <rect x="13.75" y="4" width="1.5" height="9.5"/>
    <path d="M12.75 4 H16.25 M12.75 13.5 H16.25" fill="none" stroke="#000" stroke-width="1.5" stroke-linecap="round"/>
  </g>
</svg>
