<svg xmlns="http://www.w3.org/2000/svg" viewBox="158 127 1155 838" role="img" aria-label="">
  <!--
    The halo only, with no crisp glyph. Drawn over MenuBarLogo.svg and tinted
    at runtime (it is a template image, so `contentTintColor` recolours it per
    state), with its opacity animated to pulse.

    Two blurred copies rather than one: a wide soft bloom plus a tighter, denser
    core, which reads as a glow at 20pt where a single Gaussian just looks like
    a smudge. The shapes are duplicated rather than shared through a "use"
    element, so this file depends on nothing beyond feGaussianBlur, which is
    verified to survive NSImage's SVG rendering.

    The viewBox matches MenuBarLogo.svg exactly; see the note there.

    Note for editors: an XML comment may not contain a double hyphen. Using one
    here makes NSImage reject the whole file, and it fails silently.
  -->
  <defs>
    <filter id="wide" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
    <filter id="core" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="11"/>
    </filter>
  </defs>

  <g fill="#fff" filter="url(#wide)" opacity="0.6">
    <rect x="248" y="508" width="68" height="132" rx="34"/>
    <rect x="349" y="440" width="68" height="261" rx="34"/>
    <rect x="452" y="350" width="72" height="422" rx="36"/>
    <rect x="568" y="458" width="62" height="218" rx="31"/>
    <path d="M815 217
             C739 217 678 278 678 354
             V567
             C678 668 741 741 815 741
             C889 741 951 668 951 567
             V354
             C951 278 890 217 815 217Z"/>
    <rect x="786" y="716" width="58" height="116" rx="29"/>
    <rect x="665" y="814" width="295" height="61" rx="31"/>
    <rect x="996" y="460" width="62" height="214" rx="31"/>
    <rect x="1120" y="387" width="70" height="356" rx="35"/>
    <rect x="1087" y="387" width="136" height="43" rx="21.5"/>
    <rect x="1087" y="700" width="136" height="43" rx="21.5"/>
  </g>

  <g fill="#fff" filter="url(#core)" opacity="0.9">
    <rect x="248" y="508" width="68" height="132" rx="34"/>
    <rect x="349" y="440" width="68" height="261" rx="34"/>
    <rect x="452" y="350" width="72" height="422" rx="36"/>
    <rect x="568" y="458" width="62" height="218" rx="31"/>
    <path d="M815 217
             C739 217 678 278 678 354
             V567
             C678 668 741 741 815 741
             C889 741 951 668 951 567
             V354
             C951 278 890 217 815 217Z"/>
    <rect x="786" y="716" width="58" height="116" rx="29"/>
    <rect x="665" y="814" width="295" height="61" rx="31"/>
    <rect x="996" y="460" width="62" height="214" rx="31"/>
    <rect x="1120" y="387" width="70" height="356" rx="35"/>
    <rect x="1087" y="387" width="136" height="43" rx="21.5"/>
    <rect x="1087" y="700" width="136" height="43" rx="21.5"/>
  </g>
</svg>
