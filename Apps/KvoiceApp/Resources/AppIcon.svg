    </g>
    <path d="M533 437 V482 A108 108 0 0 0 749 482 V437" fill="none" stroke="#FFFFFF" stroke-width="31" stroke-linecap="round"/>
    <g fill="#3D8BFF" stroke="#3D8BFF" stroke-linecap="round">
      <rect x="800" y="395" width="26" height="176" stroke="none"/>
      <line x1="789" y1="401" x2="837" y2="401" stroke-width="20"/>
      <line x1="789" y1="566" x2="837" y2="566" stroke-width="20"/>
    </g>
  </g>
</svg>
